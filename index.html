<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ガラクタドロップ</title>
<meta name="description" content="落ちてくるガラクタをくっつけて、とりあえず動くロボを作れ。物理まかせのおバカなパズルゲーム。">
<!-- X などのカード。クローラは JS を実行しないので、記録ごとの文はここには出せない（共通のカード）。
     記録は投稿の文に入っている。 -->
<meta property="og:title" content="ガラクタドロップ">
<meta property="og:description" content="落ちてくるガラクタをくっつけて、とりあえず動くロボを作れ。連続チャレンジで何ラウンド行ける？">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ガラクタドロップ">
<meta property="og:url" content="https://garakuta.yaapp1682.com/">
<meta property="og:image" content="https://garakuta.yaapp1682.com/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ガラクタドロップ">
<meta name="twitter:description" content="落ちてくるガラクタをくっつけて、とりあえず動くロボを作れ。">
<meta name="twitter:image" content="https://garakuta.yaapp1682.com/ogp.png">
<!-- App Store の ID が決まったら、ここと下の APP_ID を書きかえる（Safari のアプリバナー） -->
<!-- <meta name="apple-itunes-app" content="app-id=XXXXXXXXXX"> -->
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { --ink:#23262b; --ink2:#5a6152; --paper:#edf1e4; --grid:#d5dec6; --red:#e4572e; --blue:#2f7fe0; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; color:var(--ink); background-color:var(--paper);
         background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
         background-size: 32px 32px;
         font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:420px; background:#fff; border:4px solid var(--ink); border-radius:24px;
          box-shadow:0 8px 0 var(--ink); padding:28px 22px 24px; text-align:center; }
  .icon { width:96px; height:96px; border-radius:22px; border:3px solid var(--ink); }
  h1 { font-size:26px; margin:12px 0 4px; letter-spacing:.02em; }
  .tag { color:var(--ink2); font-size:14px; line-height:1.7; margin:0 0 18px; }
  .rec { display:none; background:var(--paper); border:3px solid var(--ink); border-radius:18px; padding:14px 10px; margin:0 0 18px; }
  .rec .lbl { font-size:13px; color:var(--ink2); font-weight:700; }
  .rec .big { font-size:34px; font-weight:900; color:var(--red); line-height:1.25; }
  .rec .sub { font-size:16px; font-weight:800; }
  .rec .dare { font-size:14px; color:var(--ink2); margin-top:6px; }
  a.btn { display:block; padding:15px 18px; border-radius:16px; border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink);
          text-decoration:none; font-weight:800; font-size:17px; margin:0 0 14px; }
  a.key { background:var(--red); color:#fff; }
  a.sub { background:#fff; color:var(--ink); }
  .soon { font-size:13px; color:var(--ink2); margin:-4px 0 14px; display:none; }
  footer { font-size:12px; color:var(--ink2); margin-top:6px; }
  footer a { color:var(--ink2); }
</style>
</head>
<body>
<main class="card">
  <img class="icon" src="icon.png" alt="ガラクタドロップ">
  <h1 id="name">ガラクタドロップ</h1>
  <p class="tag" id="tag">落ちてくるガラクタをくっつけて、<br>とりあえず動くロボを作れ。</p>

  <div class="rec" id="rec">
    <div class="lbl" id="recLbl">連続チャレンジの記録</div>
    <div class="big" id="recRounds"></div>
    <div class="sub" id="recScore"></div>
    <div class="dare" id="dare">この記録、超えられる？</div>
  </div>

  <a class="btn key" id="store" href="https://yaapp1682.com/#garakuta">App Store でダウンロード</a>
  <p class="soon" id="soon">もうすぐ公開です</p>
  <a class="btn sub" id="site" href="https://yaapp1682.com/#garakuta">くわしく見る</a>
  <footer><a href="https://yaapp1682.com/garakuta-privacy.html" id="priv">プライバシーポリシー</a></footer>
</main>
<script>
  // App Store の ID（数字だけ）。決まるまでは空のまま＝「もうすぐ公開」
  var APP_ID = "";

  var q = new URLSearchParams(location.search);
  var r = parseInt(q.get("r") || "", 10);
  var s = parseInt(q.get("s") || "", 10);
  var ja = (navigator.language || "ja").toLowerCase().indexOf("ja") === 0;

  if (!ja) {
    document.documentElement.lang = "en";
    document.title = "Junk Drop";
    document.getElementById("name").textContent = "Junk Drop";
    document.getElementById("tag").innerHTML = "Stick the falling junk together<br>and build a robot that somehow moves.";
    document.getElementById("recLbl").textContent = "Endless Run record";
    document.getElementById("dare").textContent = "Can you beat it?";
    document.getElementById("store").textContent = "Download on the App Store";
    document.getElementById("soon").textContent = "Coming soon";
    document.getElementById("site").textContent = "Learn more";
    document.getElementById("priv").textContent = "Privacy Policy";
    document.getElementById("priv").href = "https://yaapp1682.com/garakuta-privacy-en.html";
  }
  if (r >= 0 && r < 100000) {
    document.getElementById("rec").style.display = "block";
    document.getElementById("recRounds").textContent = ja ? r + " ラウンド突破" : r + (r === 1 ? " round" : " rounds");
    if (s >= 0 && s < 100000000) {
      document.getElementById("recScore").textContent = ja ? "スコア " + s.toLocaleString("ja-JP") + " 点" : "Score " + s.toLocaleString("en-US");
    }
  }
  if (APP_ID) {
    document.getElementById("store").href = "https://apps.apple.com/app/id" + APP_ID;
  } else {
    document.getElementById("soon").style.display = "block";
  }
</script>
</body>
</html>
